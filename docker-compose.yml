services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"

  ml-app:
    build:
      context: .
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hrsystem
      POSTGRES_USER: hrsystem
      POSTGRES_PASSWORD: hrsystem
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrsystem"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://hrsystem:hrsystem@db:5432/hrsystem
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: